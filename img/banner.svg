<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Q-Volta: fast LLM inference on one Tesla V100 and on CPUs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#16103a"/><stop offset="1" stop-color="#0d2a3a"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif">
    <text x="64" y="128" font-size="80" font-weight="800" fill="#ffffff" letter-spacing="-2">Q-Volta</text>
    <rect x="66" y="146" width="190" height="6" rx="3" fill="url(#ac)"/>
    <text x="64" y="198" font-size="25" fill="#cbd5e1">From-scratch C++20 / CUDA inference engine</text>
    <text x="64" y="232" font-size="25" fill="#cbd5e1">for Qwen3.8-27B and Inkling-2-Mini</text>
    <g font-size="17" fill="#e2e8f0">
      <g transform="translate(64,262)"><rect width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="52" y="23" text-anchor="middle">exact MTP</text></g>
      <g transform="translate(178,262)"><rect width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="52" y="23" text-anchor="middle">256K ctx</text></g>
      <g transform="translate(292,262)"><rect width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="42" y="23" text-anchor="middle">vision</text></g>
      <g transform="translate(386,262)"><rect width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="52" y="23" text-anchor="middle">web UI</text></g>
      <g transform="translate(500,262)"><rect width="164" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="82" y="23" text-anchor="middle">llama-server API</text></g>
    </g>
    <text x="64" y="328" font-size="18" fill="#94a3b8">Tesla V100 (sm_70)  ·  x86 CPU  ·  single-file .qv with tokenizer</text>
    <g transform="translate(830,50)">
      <rect width="386" height="260" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="24" y="38" font-size="14" fill="#94a3b8" letter-spacing="1.5">QWEN3.8-27B  ·  ONE V100-16GB</text>
      <text x="24" y="96" font-size="50" font-weight="800" fill="url(#ac)">58 → 136<tspan font-size="20" font-weight="500" fill="#cbd5e1" dx="10">tok/s</tspan></text>
      <text x="24" y="124" font-size="15" fill="#94a3b8">plain → exact MTP (e1 file, code prompt)</text>
      <line x1="24" x2="362" y1="148" y2="148" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="24" y="182" font-size="14" fill="#94a3b8" letter-spacing="1.5">INKLING-2-MINI  ·  26B MoE</text>
      <text x="24" y="224" font-size="34" font-weight="800" fill="#e2e8f0">~120<tspan font-size="18" font-weight="500" fill="#cbd5e1" dx="8">tok/s through the server</tspan></text>
      <text x="24" y="246" font-size="14" fill="#94a3b8">9.9 GiB file · text + image input</text>
    </g>
  </g>
</svg>
